[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instanttrack-root-feedback"
version = "0.1.0"
description = "InstantTrack with reference-relative root position feedback for G1 motion tracking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab",
  "torch @ https://download-r2.pytorch.org/whl/cu126/torch-2.14.1%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=75727245346d8f92224a860bf40c56bd681edcfa0456d01d7dfcb0bf6f0cf86c",
  "warp-lang==1.18.0+cu12",
  "mujoco==3.16.0",
  "mujoco-warp==3.16.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "matplotlib",
  "pillow",
]

[project.optional-dependencies]
export = ["onnx", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "8bb2bc9e187797689ec82c78c35019afd2fd0376" }
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl" }
